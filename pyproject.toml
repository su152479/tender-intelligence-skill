[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-opportunity-radar"
version = "0.1.0"
description = "Personal MVP for discovering precast engineering opportunities"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "requests>=2.31", "beautifulsoup4>=4.12", "playwright>=1.45", "python-dotenv>=1.0", "pydantic>=2.7"]

[project.optional-dependencies]
ai = ["openai>=1.40"]
dev = ["pytest>=8.0"]
documents = ["pypdf>=5.0", "python-docx>=1.1", "openpyxl>=3.1"]

[project.scripts]
radar = "opportunity_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
