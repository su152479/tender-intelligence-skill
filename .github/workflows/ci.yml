name: CI

on:
  push:
  pull_request:

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RADAR_AI_PROVIDER: heuristic
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Python tests
        run: python -m pytest -q
      - name: Opportunity rule evaluation
        run: python -m opportunity_radar.cli evaluate
